<!DOCTYPE html>
<html>
<head>
    <title>Audio Source Fetcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="header">
                <div class="icon-container">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </div>
                <h1>Audio Source Fetcher</h1>
                <p class="subtitle">Enter a Soundsnap URL to fetch the audio source</p>
            </div>

            <div class="input-group">
                <input type="text" id="urlInput" placeholder="https://www.soundsnap.com/..." />
                <button id="fetchButton">
                    <span class="button-text">Fetch Audio</span>
                    <div class="loader" style="display: none;"></div>
                </button>
            </div>

            <div id="errorContainer" class="error-container" style="display: none;">
                <p id="errorText"></p>
            </div>

            <div id="audioLinkContainer"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
